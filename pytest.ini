[pytest]
# Два класса тестов, разделённые потому, что счёт "51 passed" вводил в
# заблуждение: он складывал проверки движка с проверками, которые к движку не
# относятся, а часть из них не может упасть по построению.
#
#   product  - проверяет код, который мы продаём и о котором заявляем цифры
#   concept  - модели, экономика и заглушки приборов. Проходят, но ничего не
#              доказывают о движке; часть сравнивает литерал с тем же литералом
#
# Проверка продукта:   python3 -m pytest -m product research/tests/ -q
# Всё вместе:          python3 -m pytest research/tests/ -q
markers =
    product: checks the engine this repository makes claims about
    concept: models, economics and instrument stubs - not evidence about the engine
