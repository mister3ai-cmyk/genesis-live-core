name: Benchmark

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [ gcc, clang ]
        cppflags: [ "", "-DSRP_BITS=256 -DK_CAND=512" ]
    steps:
      - uses: actions/checkout@v7

      - name: Unit tests
        working-directory: tests
        run: make check CC=${{ matrix.cc }} CPPFLAGS="${{ matrix.cppflags }}"

      - name: rt_core (C99, -Werror, no malloc)
        working-directory: research/rt_core
        run: make check check-nomalloc CC=${{ matrix.cc }}

      - name: Build
        working-directory: benchmarks
        run: make CC=${{ matrix.cc }} CPPFLAGS="${{ matrix.cppflags }}"

      - name: Run
        working-directory: benchmarks
        run: ./run_benchmark && ./run_benchmark --center

  embedded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cross toolchains
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-aarch64-linux-gnu gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-user qemu-system-arm

      - name: rt_core on aarch64 (tests under qemu), Cortex-M4, Cortex-M7
        working-directory: research/rt_core
        run: make embedded

      - name: rt_core bare metal, no OS (qemu-system-arm mps2-an386 M4, mps2-an500 M7)
        working-directory: research/rt_core
        run: make baremetal

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: python -m pip install numpy pytest cryptography

      - name: Build rt_core for ctypes tests
        run: make -C research/rt_core librt_core.so

      - name: Python tests
        run: python -m pytest -q

      - name: Reconsolidation invariants
        run: python research/tests/test_reconsolidation_plasticity.py
