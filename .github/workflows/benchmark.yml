name: Benchmark

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [ gcc, clang ]
        cppflags: [ "", "-DSRP_BITS=256 -DK_CAND=512" ]
    steps:
      - uses: actions/checkout@v7

      - name: Build
        working-directory: benchmarks
        run: make CC=${{ matrix.cc }} CPPFLAGS="${{ matrix.cppflags }}"

      - name: Run
        working-directory: benchmarks
        run: ./run_benchmark && ./run_benchmark --center
