name: Benchmark

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [ gcc, clang ]
        cppflags: [ "", "-DSRP_BITS=256 -DK_CAND=512" ]
    steps:
      - uses: actions/checkout@v7

      - name: Unit tests
        working-directory: tests
        run: make check CC=${{ matrix.cc }} CPPFLAGS="${{ matrix.cppflags }}"

      - name: rt_core (C99, -Werror, no malloc)
        working-directory: research/rt_core
        run: make check check-nomalloc CC=${{ matrix.cc }}

      - name: Build
        working-directory: benchmarks
        run: make CC=${{ matrix.cc }} CPPFLAGS="${{ matrix.cppflags }}"

      - name: Run
        working-directory: benchmarks
        run: ./run_benchmark && ./run_benchmark --center

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: python -m pip install numpy pytest cryptography

      - name: Build rt_core for ctypes tests
        run: make -C research/rt_core librt_core.so

      - name: Python tests
        run: python -m pytest -q

      - name: Reconsolidation invariants
        run: python research/tests/test_reconsolidation_plasticity.py
